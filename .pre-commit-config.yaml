repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: frontend-eslint
        name: frontend eslint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false

