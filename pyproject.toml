[tool.ruff]
target-version = "py38"
line-length = 120
extend-exclude = [
  "venv",
  ".venv",
  "exam_paper_assistant/venv",
  "exam_paper_assistant/archive",
  "exam_paper_assistant/playground",
  "exam_paper_assistant/artifacts",
  "exam_paper_assistant/data",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
