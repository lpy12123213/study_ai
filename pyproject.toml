[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  "venv",
  ".venv",
  ".local",
  "frontend/node_modules",
  "frontend/dist",
  "archive",
  "playground",
  "artifacts",
  "data",
]

[tool.ruff.lint]
# BLE001 (flake8-blind-except) blocks NEW `except Exception` blocks. Existing,
# reviewed broad excepts are grandfathered via per-file-ignores below.
select = ["E", "F", "I", "BLE001"]
ignore = ["E501"]

# Files with reviewed-but-kept broad `except Exception` (resilience/cleanup/
# best-effort paths). This list is intentionally file-level rather than
# directory-level: the affected directories also contain genuinely clean files,
# and we want BLE001 to keep flagging NEW blind excepts there (and in any new
# file). Regenerate with:
#   ruff check backend --select BLE001 --output-format=concise
[tool.ruff.lint.per-file-ignores]
"backend/agent/core.py" = ["BLE001"]
"backend/agent/executor.py" = ["BLE001"]
"backend/agent/planning/planner.py" = ["BLE001"]
"backend/agent/react/loop.py" = ["BLE001"]
