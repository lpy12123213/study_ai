              - main [ref=f2e177]:
                - generic [ref=f2e180]:
                  - paragraph [ref=f2e181]: Learn
                  - heading "Stitch via MCP" [level=1] [ref=f2e182]
                  - paragraph [ref=f2e183]: Connect IDEs and CLIs to Stitch using the Model Context Protocol.
                - generic [ref=f2e185]:
                  - generic [ref=f2e186]:
                    - paragraph [ref=f2e187]: The Stitch Model Context Protocol (MCP) server allows your favorite AI tools like Cursor, Antigravity, or the Gemini CLI to directly interact with your Stitch projects.
                    - generic [ref=f2e188]:
                      - heading "Understanding Remote MCP" [level=2] [ref=f2e189]
                      - link "Section titled “Understanding Remote MCP”" [ref=f2e190] [cursor=pointer]:
                        - /url: "#understanding-remote-mcp"
                        - img [ref=f2e192]
                        - generic [ref=f2e194]: Section titled “Understanding Remote MCP”
                    - paragraph [ref=f2e195]:
                      - text: Most MCP servers you use are
                      - strong [ref=f2e196]: Local
                      - text: . They read files on your hard drive or run scripts on your machine. Stitch is a
                      - strong [ref=f2e197]: Remote
                      - text: MCP server. It lives in the cloud.
                    - paragraph [ref=f2e198]: Because it is remote, it requires a secure “handshake” to ensure that the AI agent acting on your behalf actually has permission to modify your designs.
                    - generic [ref=f2e199]:
                      - heading "API Keys vs OAuth" [level=2] [ref=f2e200]
                      - link "Section titled “API Keys vs OAuth”" [ref=f2e201] [cursor=pointer]:
                        - /url: "#api-keys-vs-oauth"
                        - img [ref=f2e203]
                        - generic [ref=f2e205]: Section titled “API Keys vs OAuth”
                    - paragraph [ref=f2e206]: "The Stitch MCP server supports two authentication methods:"
                    - list [ref=f2e207]:
                      - listitem [ref=f2e208]:
                        - strong [ref=f2e209]: "API Keys:"
                        - text: Persistent keys generated in the
                        - link "Stitch Settings page" [ref=f2e210] [cursor=pointer]:
                          - /url: /settings
                        - text: .
                      - listitem [ref=f2e211]:
                        - strong [ref=f2e212]: "OAuth:"
                        - text: A browser-based authentication flow required by specific AI clients that do not support manual key entry, or for environments where storing persistent secrets on disk is restricted.
                    - generic [ref=f2e213]:
                      - heading "When to use which" [level=3] [ref=f2e214]
                      - link "Section titled “When to use which”" [ref=f2e215] [cursor=pointer]:
                        - /url: "#when-to-use-which"
                        - img [ref=f2e217]
                        - generic [ref=f2e219]: Section titled “When to use which”
                    - paragraph [ref=f2e220]: In most cases, API Keys are the easiest approach. They are the fastest way to get your tool connected. However, OAuth is worth the extra minute of setup in specific situations.
                    - table [ref=f2e221]:
                      - rowgroup [ref=f2e222]:
                        - row "Scenario Use API Keys if… Use OAuth if…" [ref=f2e223]:
                          - columnheader "Scenario" [ref=f2e224]
                          - columnheader "Use API Keys if…" [ref=f2e225]:
                            - text: Use
                            - strong [ref=f2e226]: API Keys
                            - text: if…
                          - columnheader "Use OAuth if…" [ref=f2e227]:
                            - text: Use
                            - strong [ref=f2e228]: OAuth
                            - text: if…
                      - rowgroup [ref=f2e229]:
                        - row "Client Support Your tool (e.g., Cursor, Antigravity, or the Gemini CLI) accepts an API key in a config file or environment variable. Your tool (e.g., web-based tools) requires a “Sign In” flow and doesn’t provide a way to manually input a key." [ref=f2e230]:
                          - cell "Client Support" [ref=f2e231]:
                            - strong [ref=f2e232]: Client Support
                          - cell "Your tool (e.g., Cursor, Antigravity, or the Gemini CLI) accepts an API key in a config file or environment variable." [ref=f2e233]
                          - cell "Your tool (e.g., web-based tools) requires a “Sign In” flow and doesn’t provide a way to manually input a key." [ref=f2e234]
                        - row "Storage Policy You are on a private machine where saving a secret key in a local .json or .env file is standard practice. You are in a “Zero-Trust” or ephemeral environment where saving persistent secrets to the hard drive is blocked or risky." [ref=f2e235]:
                          - cell "Storage Policy" [ref=f2e236]:
                            - strong [ref=f2e237]: Storage Policy
                          - cell "You are on a private machine where saving a secret key in a local .json or .env file is standard practice." [ref=f2e238]:
                            - text: You are on a private machine where saving a secret key in a local
                            - code [ref=f2e239]: .json
                            - text: or
                            - code [ref=f2e240]: .env
                            - text: file is standard practice.
                          - cell "You are in a “Zero-Trust” or ephemeral environment where saving persistent secrets to the hard drive is blocked or risky." [ref=f2e241]
                        - row "Revocation You are comfortable manually deleting a key from the Stitch Settings page and then finding/removing it from your local files. You want the ability to “Log Out” and instantly invalidate the tool’s access via the Stitch Settings page without hunting for local files." [ref=f2e242]:
                          - cell "Revocation" [ref=f2e243]:
                            - strong [ref=f2e244]: Revocation
                          - cell "You are comfortable manually deleting a key from the Stitch Settings page and then finding/removing it from your local files." [ref=f2e245]:
                            - text: You are comfortable manually deleting a key from the
                            - link "Stitch Settings page" [ref=f2e246] [cursor=pointer]:
                              - /url: /settings
                            - text: and then finding/removing it from your local files.
                          - cell "You want the ability to “Log Out” and instantly invalidate the tool’s access via the Stitch Settings page without hunting for local files." [ref=f2e247]:
                            - text: You want the ability to “Log Out” and instantly invalidate the tool’s access via the
                            - link "Stitch Settings page" [ref=f2e248] [cursor=pointer]:
                              - /url: /settings
                            - text: without hunting for local files.
                        - row "Session Logic You want a connection that stays active indefinitely until you manually change it. You prefer a session-based connection that can be set to expire or require a re-approval after a period of inactivity." [ref=f2e249]:
                          - cell "Session Logic" [ref=f2e250]:
