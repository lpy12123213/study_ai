name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  backend:
    name: Backend (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall backend scripts -q

      - name: Ruff
        run: python -m ruff check backend/api backend/core backend/tests

      - name: Mypy smoke
        run: python -m mypy backend/core backend/database --ignore-missing-imports --follow-imports=skip

      - name: Structure lint
        run: python scripts/audit/structure_lint.py --strict

      - name: Exception policy
        run: python scripts/audit/exception_policy.py backend --strict --max-total 0 --limit 0

      - name: Alembic upgrade and downgrade
        env:
          STUDY_AI_DB_PATH: .local/ci/alembic.db
        run: |
          mkdir -p .local/ci
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini downgrade -1

      - name: Backend unit tests
        run: python -m unittest discover -s backend/tests -p "test_*.py"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python for OpenAPI export
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies for OpenAPI export
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generated OpenAPI types are current
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code src/api/__generated__.ts

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: frontend
        run: npm run e2e
