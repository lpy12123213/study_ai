name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  backend:
    name: Backend (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall backend scripts -q

      - name: Ruff
        run: python -m ruff check backend scripts

      - name: Structure lint
        run: python scripts/audit/structure_lint.py --strict

      - name: Exception policy
        run: python scripts/audit/exception_policy.py backend --strict --max-total 0 --limit 0

      - name: Alembic upgrade and downgrade
        env:
          STUDY_AI_DB_PATH: .local/ci/alembic.db
        run: |
          mkdir -p .local/ci
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini downgrade -1

      - name: Backend unit tests
        run: python -m unittest discover -s backend/tests -p "test_*.py"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-e2e:
    name: Frontend visual e2e
    # 视觉快照基线是 win32（*-win32.png），必须在 Windows runner 上跑
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium

      - name: Playwright
        working-directory: frontend
        run: npm run test:e2e
