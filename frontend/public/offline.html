<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Study AI 离线</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(420px, 100%);
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 24px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgb(15 23 42 / 10%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 1.3;
      }

      p {
        margin: 0;
        color: #475569;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前处于离线状态</h1>
      <p>已缓存的页面会继续可用；需要后端数据的功能会在网络恢复后自动刷新。</p>
    </main>
  </body>
</html>
