# Docker Compose configuration for agent workers
# Used for sandboxed code execution

version: '3.8'

services:
  agent-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: epa-agent-worker
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    # Security settings
    security_opt:
      - no-new-privileges:true
    read_only: true
    
    # Network isolation
    networks:
      - agent-network
    
    # Temporary filesystem for code execution
    tmpfs:
      - /tmp:size=50M,mode=1777
    
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - DISABLE_DOCKER_AGENT=false
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  agent-network:
    driver: bridge
    internal: true  # No external network access
